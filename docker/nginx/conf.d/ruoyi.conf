# RuoYi-Vue-Plus 前端代理配置
# 前端运行在宿主机 81 端口 (Vite 开发服务器)
# 后端运行在宿主机 8080 端口

upstream ruoyi-backend {
    server host.docker.internal:8080;
    keepalive 64;
}

upstream ruoyi-frontend {
    server host.docker.internal:81;
    keepalive 64;
}

server {
    listen 80;
    server_name localhost;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 前端代理
    location / {
        proxy_pass http://ruoyi-frontend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 后端 API 代理
    location /prod-api/ {
        proxy_pass http://ruoyi-backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 日志
    access_log /var/log/nginx/ruoyi_access.log main;
    error_log /var/log/nginx/ruoyi_error.log warn;
}

