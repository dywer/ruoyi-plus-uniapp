# Docker Compose 生产环境配置
# 用于生产部署，优化配置并启用安全设置

services:
  # ==================== MySQL ====================
  mysql:
    image: mysql:8.0.42
    container_name: prod-mysql
    restart: always
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-YourSecurePassword123!}
      MYSQL_DATABASE: ry-vue
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ./docker/mysql/data:/var/lib/mysql
      - ./docker/mysql/conf:/etc/mysql/conf.d
      - ./docker/sql/ry_vue_5.X.sql:/docker-entrypoint-initdb.d/01-ry_vue.sql
      - ./docker/sql/ry_job.sql:/docker-entrypoint-initdb.d/02-ry_job.sql
      - ./docker/sql/ry_workflow.sql:/docker-entrypoint-initdb.d/03-ry_workflow.sql
    command:
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --explicit_defaults_for_timestamp=true
      --lower_case_table_names=1
      --max_connections=1000
      --innodb_buffer_pool_size=1G
      --innodb_log_file_size=256M
    networks:
      - ruoyi-prod-network
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 2G
        reservations:
          cpus: '2.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-YourSecurePassword123!}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Redis ====================
  redis:
    image: redis:7.2.8
    container_name: prod-redis
    restart: always
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./docker/redis/conf:/redis/config:rw
      - ./docker/redis/data:/redis/data
    command: "redis-server /redis/config/redis.conf --appendonly yes --requirepass ${REDIS_PASSWORD:-YourRedisPassword123!}"
    networks:
      - ruoyi-prod-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== MinIO ====================
  minio:
    image: minio/minio:RELEASE.2024-12-25T14-45-07Z
    container_name: prod-minio
    restart: always
    environment:
      TZ: Asia/Shanghai
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ruoyi}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-YourMinioPassword123!}
      MINIO_SERVER_URL: ${MINIO_SERVER_URL:-}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ./docker/minio/data:/data
      - ./docker/minio/config:/root/.minio
    command: server --address ':9000' --console-address ':9001' /data
    networks:
      - ruoyi-prod-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ==================== Nginx ====================
  nginx:
    image: nginx:1.25.4-alpine
    container_name: prod-nginx
    restart: always
    environment:
      TZ: Asia/Shanghai
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/html:/usr/share/nginx/html:ro
      - ./docker/nginx/log:/var/log/nginx
      - ./docker/nginx/cert:/etc/nginx/cert:ro
    depends_on:
      - ruoyi-server
    networks:
      - ruoyi-prod-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M

  # ==================== RuoYi Server ====================
  ruoyi-server:
    build:
      context: ./ruoyi-plus-uniapp-workflow/ruoyi-admin
      dockerfile: Dockerfile
    container_name: prod-server
    restart: always
    environment:
      TZ: Asia/Shanghai
      SERVER_PORT: ${SERVER_PORT:-8080}
      SPRING_PROFILES_ACTIVE: prod-docker
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-YourSecurePassword123!}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-YourRedisPassword123!}
      JAVA_OPTS: >-
        -Xms512m
        -Xmx1g
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -XX:+HeapDumpOnOutOfMemoryError
        -Djava.security.egd=file:/dev/./urandom
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    volumes:
      - ./docker/server/logs:/ruoyi/server/logs
      - ./docker/server/temp:/ruoyi/server/temp
      - ./docker/minio/data:/docker/minio/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ruoyi-prod-network
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 2G
        reservations:
          cpus: '2.0'
          memory: 1G

  # ==================== SnailJob Server ====================
  snailjob-server:
    image: opengoofy/snail-job:1.9.0
    container_name: prod-snailjob
    restart: always
    environment:
      TZ: Asia/Shanghai
      SNAIL_JOB_PORT: 8800
      SNAIL_JOB_WEB_PORT: 17888
    ports:
      - "8800:8800"
      - "17888:17888"
    volumes:
      - ./docker/snailjob/logs:/ruoyi/snailjob/logs
    networks:
      - ruoyi-prod-network

  # ==================== Monitor Admin ====================
  monitor-admin:
    image: ruoyi/ruoyi-monitor-admin:5.6.0
    container_name: prod-monitor
    restart: always
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${MONITOR_PORT:-8090}:8080"
    volumes:
      - ./docker/monitor/logs:/ruoyi/monitor/logs
    networks:
      - ruoyi-prod-network

networks:
  ruoyi-prod-network:
    driver: bridge
