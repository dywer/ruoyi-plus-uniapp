# Docker Compose 开发环境配置
# 用于本地开发，所有服务运行在独立网络中

services:
  # ==================== MySQL ====================
  mysql:
    image: mysql:8.0.42
    container_name: ry-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ry-vue
    ports:
      - "3306:3306"
    volumes:
      # 数据持久化
      - ./docker/mysql/data:/var/lib/mysql
      # 配置文件
      - ./docker/mysql/conf:/etc/mysql/conf.d
      # 初始化 SQL
      - ./docker/sql/ry_vue_5.X.sql:/docker-entrypoint-initdb.d/01-ry_vue.sql
      - ./docker/sql/ry_job.sql:/docker-entrypoint-initdb.d/02-ry_job.sql
      - ./docker/sql/ry_workflow.sql:/docker-entrypoint-initdb.d/03-ry_workflow.sql
    command:
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --explicit_defaults_for_timestamp=true
      --lower_case_table_names=1
    networks:
      - ruoyi-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Redis ====================
  redis:
    image: redis:7.2.8
    container_name: ry-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6379:6379"
    volumes:
      - ./docker/redis/conf:/redis/config:rw
      - ./docker/redis/data:/redis/data
    command: "redis-server /redis/config/redis.conf --appendonly yes --requirepass ruoyi123"
    networks:
      - ruoyi-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== MinIO ====================
  # 暂时禁用，网络问题无法拉取镜像
  # minio:
  #   image: docker.1panel.live/library/minio:RELEASE.2024-12-25T14-45-07Z
