  #   restart: unless-stopped
  #   environment:
  #     TZ: Asia/Shanghai
  #     MINIO_ROOT_USER: ruoyi
  #     MINIO_ROOT_PASSWORD: ruoyi123
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   volumes:
  #     - ./docker/minio/data:/data
  #     - ./docker/minio/config:/root/.minio
  #   command: server --address ':9000' --console-address ':9001' /data
  #   networks:
  #     - ruoyi-network
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
  #     interval: 30s
  #     timeout: 20s
  #     retries: 3

  # ==================== Nginx ====================
  nginx:
    image: nginx:1.25.4-alpine
    container_name: ry-nginx
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/html:/usr/share/nginx/html:ro
      - ./docker/nginx/log:/var/log/nginx
      - ./docker/nginx/cert:/etc/nginx/cert:ro
    depends_on:
      - ruoyi-server
    networks:
      - ruoyi-network

  # ==================== RuoYi Server ====================
  ruoyi-server:
    build:
      context: ./ruoyi-plus-uniapp-workflow/ruoyi-admin
      dockerfile: Dockerfile
    container_name: ry-server
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: dev-docker
    ports:
      - "8080:8080"
    volumes:
      - ./docker/server/logs:/ruoyi/server/logs
      - ./docker/server/temp:/ruoyi/server/temp
      - ./docker/minio/data:/docker/minio/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ruoyi-network

  # ==================== SnailJob Server ====================
